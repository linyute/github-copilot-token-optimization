site_name: Token 優化指南
site_description: 實用指南，在保持品質的前提下降低 GitHub Copilot 的 token 使用量。
theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
extra_css:
  - stylesheets/extra.css
nav:
    - 首頁: index.md
    - 從這裡開始:
      - 實用設定: 10-practical-setup.md
      - Token 為何重要: 01-why-tokens-matter.md
    - 請求與回應:
      - 輸出控制: 05-output-control.md
      - 提示詞壓縮: 02-prompt-compression.md
      - 語言比較: 03-language-comparison.md
    - 已載入的上下文:
      - 上下文管理: 04-context-management.md
      - 常駐上下文問題: 07-agents-md-problem.md
    - 工具:
      - MCP 與工具成本: 08-mcp-tool-costs.md
    - 工作流程與返工:
      - 工作流程最佳化: 06-workflow-optimization.md
      - 每個 Token 的成果: 13-outcome-per-token.md
    - 費用控管:
      - 模型選擇與定價: 11-models-and-pricing.md
      - 企業治理: 12-enterprise-governance.md
    - 實證資料:
      - 比較與數據: 09-comparisons-data.md
